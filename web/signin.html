<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>Sign in · SONIVOX</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/styles.css"></head>
<body class="auth-page"><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><main class="auth-card"><a class="auth-brand" href="/"><span class="brand-mark">S</span><strong>SONI<span>VOX</span></strong></a><div class="eyebrow">YOUR PRIVATE VOICE STUDIO</div><h1>Welcome <span>back.</span></h1><p>Sign in to continue to your SONIVOX workspace.</p><form id="auth-form"><label for="auth-email">EMAIL ADDRESS</label><input id="auth-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="auth-password">PASSWORD</label><input id="auth-password" name="password" type="password" autocomplete="current-password" required placeholder="Your password"><button class="primary-button full-button" id="auth-submit" type="submit">Sign in</button></form><p class="auth-message" id="auth-message" role="status" aria-live="polite"></p><small>New to SONIVOX? <a href="/signup">Create an account</a></small><small class="auth-privacy">Your voice samples stay private to your account.</small></main><script type="module" src="/assets/auth.js"></script></body></html>
