<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>Create account · SONIVOX</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/styles.css"></head>
<body class="auth-page"><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><main class="auth-card"><a class="auth-brand" href="/"><span class="brand-mark">S</span><strong>SONI<span>VOX</span></strong></a><div class="eyebrow">START YOUR VOICE JOURNEY</div><h1>Create your <span>account.</span></h1><p>Set up your private workspace and start building your voice library.</p><form id="auth-form"><label for="auth-email">EMAIL ADDRESS</label><input id="auth-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="auth-password">CREATE PASSWORD</label><input id="auth-password" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"><label for="auth-confirm">CONFIRM PASSWORD</label><input id="auth-confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Enter your password again"><button class="primary-button full-button" id="auth-submit" type="submit">Create account</button></form><div class="auth-divider"><span>OR CONTINUE WITH</span></div><button class="google-button" id="google-auth" type="button"><span class="google-g" aria-hidden="true">G</span> Continue with Google</button><p class="auth-message" id="auth-message" role="status" aria-live="polite"></p><small>Already have an account? <a href="/signin">Sign in</a></small><small class="auth-privacy">By creating an account, you agree to use only voice samples you own or are authorized to use.</small></main><script type="module" src="/assets/auth.js"></script></body></html>
